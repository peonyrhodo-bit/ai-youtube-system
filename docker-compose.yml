services:

  ai-youtube-system:
    build: .
    container_name: ai-youtube-system
    restart: unless-stopped

    environment:
      DATA_DIR: /app/data

      ENGINE_URL: http://site-insight-engine:8000

      FREE_MODE: ${FREE_MODE:-true}
      AUTONOMOUS: ${AUTONOMOUS:-false}

    volumes:
      - ./data:/app/data
      - ./backups:/app/backups
      - ./assets:/app/assets

    depends_on:
      - site-insight-engine

    ports:
      - "8000:8000"


  site-insight-engine:
    build:
      context: ../site-insight-engine

    container_name: site-insight-engine
    restart: unless-stopped

    environment:
      DATA_DIR: /app/data
      MCP_URL: http://youtube-mcp:8000/mcp

    volumes:
      - ../site-insight-engine/data:/app/data

    ports:
      - "8001:8000"

    depends_on:
      - youtube-mcp


  youtube-mcp:
    build:
      context: ../youtube-mcp

    container_name: youtube-mcp
    restart: unless-stopped

    environment:
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY}

    ports:
      - "8002:8000"
