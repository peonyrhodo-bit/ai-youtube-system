services:

  ai-youtube-system:
    build: .
    container_name: ai-youtube-system
    restart: unless-stopped

    environment:
      DATA_DIR: /app/data

      MCP_URL: ${MCP_URL:-https://youtube-mcp-u39z.onrender.com/mcp}

      FREE_MODE: ${FREE_MODE:-true}
      AUTONOMOUS: ${AUTONOMOUS:-false}

      SERVICE_CHECK_INTERVAL: ${SERVICE_CHECK_INTERVAL:-60}

    volumes:
      - ./data:/app/data
      - ./backups:/app/backups
      - ./assets:/app/assets

    depends_on:
      - site-insight-engine
      - youtube-mcp

  site-insight-engine:
    build:
      context: ../site-insight-engine
    container_name: site-insight-engine
    restart: unless-stopped

    environment:
      DATA_DIR: /app/data
      MCP_URL: http://youtube-mcp:8000/mcp

    volumes:
      - ../site-insight-engine/data:/app/data

    ports:
      - "8000:8000"

  youtube-mcp:
    build:
      context: ../youtube-mcp
    container_name: youtube-mcp
    restart: unless-stopped

    environment:
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY}

    ports:
      - "8001:8000"
